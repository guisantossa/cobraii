user  nginx;
worker_processes  auto;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  # gzip simples (brotli exigiria módulo extra)
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache agressivo para arquivos com hash no nome (ex: app.8f3a1c2a.js)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Arquivos estáticos sem hash (imgs internas, favicon básico)
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    # SPA fallback: qualquer rota do app volta para index.html
    location / {
      try_files $uri /index.html;
    }
  }
}
